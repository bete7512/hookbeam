            type: string
          type: array
        expectedRevision:
          description: When set, the change applies only if the endpoint is still at this revision; otherwise `409`.
          format: int32
          type: integer
        url:
          format: uri
          maxLength: 2048
          type: string
      type: object
    WorkspaceLimits:
      properties:
        limits:
          properties:
            backlogPerWorkspace:
              description: Non-terminal deliveries the workspace may hold.
              type: integer
            endpointsPerApplication:
              type: integer
            fanoutPerMessage:
              type: integer
          required:
            - endpointsPerApplication
            - fanoutPerMessage
            - backlogPerWorkspace
          type: object
        usage:
          properties:
            applications:
              items:
                $ref: '#/components/schemas/ApplicationEndpointCount'
              type: array
            backlog:
              description: Non-terminal deliveries right now, counted up to the cap.
              type: integer
          required:
            - backlog
            - applications
          type: object
      required:
        - limits
        - usage
      type: object
  securitySchemes:
    apiKeyAuth:
      bearerFormat: hb_...
      description: A workspace API key sent as a bearer token; keys start with `hb_`.
      scheme: bearer
      type: http
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    cookieAuth:
      in: cookie
      name: goauth_access_hookbeam
      type: apiKey
info:
  contact:
    name: Hookbeam maintainers
    url: https://github.com/bete7512/hookbeam
  description: |
    Errors are JSON `Error` objects; every response carries an `X-Request-Id` header.
    Routes under `/v1/auth` (signup, login, refresh, verification, password reset, Google login, profile) are served by goauth and merged into this document at runtime.
  license:
    name: MIT
  title: Hookbeam API
  version: 0.1.0
openapi: 3.0.3
paths:
  /healthz:
    get:
      description: Reports that the process is up and serving; never checks dependencies, so a database blip does not get the task killed.
      operationId: getHealthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Process is alive.
      security: []
      summary: Liveness probe
      tags:
        - system
  /readyz:
    get:
      description: Pings every hard dependency (Postgres and the delivery service) and returns 503 naming the failed one, so the load balancer takes this replica out of rotation.
      operationId: getReadyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: All dependency checks passed.
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Readiness probe
      tags:
        - system
  /v1/api-keys:
    get:
      description: Keys of the active workspace, including revoked and expired ones; the secret is never returned.
      operationId: listApiKeys
      parameters:
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
        - description: Case-insensitive match on the name.
          in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            default: id
            enum:
              - id
              - name
              - createdAt
              - lastUsedAt
            type: string
        - in: query
          name: sort_dir
          schema:
            default: asc
            enum:
              - asc
              - desc
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
          description: A page of API keys.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: List the workspace's API keys
      tags:
        - api-keys
    post:
      description: Workspace owners and admins only. The response carries the secret once; store it, it cannot be retrieved again.
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
          description: The key, with its secret.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Create an API key
      tags:
        - api-keys
  /v1/api-keys/{id}:
    delete:
      description: Workspace owners and admins only. Revocation is immediate and permanent; a revoked key answers 404.
      operationId: revokeApiKey
      responses:
        "204":
          description: Revoked.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Revoke an API key
      tags:
        - api-keys
    parameters:
      - $ref: '#/components/parameters/ApiKeyId'
  /v1/applications:
    post:
      description: Registers an application in the active workspace. Names are unique per workspace.
      operationId: createApplication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: The application.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Create a consumer application in the development environment
      tags:
        - applications
  /v1/applications/{applicationId}:
    get:
      operationId: getApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: The application.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Read an application
      tags:
        - applications
    patch:
      description: Owners and admins. `responsePreviewsEnabled` lets readers of payloads also see attempt response previews.
      operationId: updateApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: The application after the change.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Change an application's settings
      tags:
        - applications
  /v1/applications/{applicationId}/api-keys:
    post:
      description: |
        The default sender credential: it submits only to this application. Same body as `POST /v1/api-keys`; the raw key is returned once.
      operationId: createApplicationApiKey
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
          description: The key, with its secret shown once.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationFailed'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Create an API key bound to one application
      tags:
        - api-keys
  /v1/applications/{applicationId}/endpoints:
    get:
      description: With subscriptions and health; archived endpoints are included with their `archivedAt`. `waiting` and `secrets` are only on the single-endpoint read.
      operationId: listApplicationEndpoints
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointList'
          description: The endpoints, oldest first.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: List an application's endpoints
      tags:
        - endpoints
    post:
      description: |
        Registers a destination URL and the event types it receives (none means every type). The response carries
        the signing secret once; receivers verify `webhook-signature` with it (Standard Webhooks, HMAC-SHA256).
      operationId: createEndpoint
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpointRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointCreated'
          description: The endpoint and its signing secret.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Register an endpoint
      tags:
        - endpoints
  /v1/applications/{applicationId}/messages:
    get:
      description: The explorer, paged with limit and offset, sorted by `sort_by` (default id) and `sort_dir` (default asc).
      operationId: listApplicationMessages
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
        - description: Exact event type.
          in: query
          name: type
          schema:
            type: string
        - description: Exact sender event id.
          in: query
          name: external_id
          schema:
            type: string
        - in: query
          name: accepted_after
          schema:
            format: date-time
            type: string
        - in: query
          name: accepted_before
          schema:
            format: date-time
            type: string
        - description: Keep messages with at least one delivery in this state.
          in: query
          name: outcome
          schema:
            enum:
              - queued
              - in_flight
              - retry_scheduled
              - succeeded
              - failed
              - cancelled
            type: string
        - in: query
          name: sort_by
          schema:
            default: id
            enum:
              - id
              - acceptedAt
            type: string
        - in: query
          name: sort_dir
          schema:
            default: asc
            enum:
              - asc
              - desc
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
          description: A page of messages with their delivery counts; payloads are never listed.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth:
            - messages:read
      summary: List an application's messages
      tags:
        - messages
    post:
      description: |
        Accepts an event for delivery to every endpoint of the application subscribed to its `type`. `202` means the
        delivery service committed the message and one delivery per endpoint; it says nothing about receivers yet.
        The exact request bytes become the outbound body. A key bound to another application is `403`; a key over its
        submission rate is `429` with `Retry-After`. `Idempotency-Key` is required and scoped to the application:
        the same key with the same bytes returns the first result with `duplicate: true`; other bytes under the same key are `409`.
      operationId: submitMessage
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - example: order-817-shipped-v1
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSubmission'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAccepted'
          description: Accepted and durably planned.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - apiKeyAuth:
            - messages:write
      summary: Submit an event
      tags:
        - messages
  /v1/audit:
    get:
      description: Every role may read. Events from the control plane (keys, member roles, invitations) and the data plane (endpoints, deliveries, payload reads) merged newest first.
      operationId: listAuditEvents
      parameters:
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
        - in: query
          name: actor_id
          schema:
            type: string
        - description: endpoint, delivery, message, api_key, member, environment or application.
          in: query
          name: resource_type
          schema:
            type: string
        - in: query
          name: resource_id
          schema:
            format: int64
            type: integer
        - in: query
          name: after
          schema:
            format: date-time
            type: string
        - in: query
          name: before
          schema:
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
          description: A page of audit events.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: List the workspace's audit events
      tags:
        - audit
  /v1/deliveries/{deliveryId}/attempts:
    get:
      operationId: listDeliveryAttempts
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptList'
          description: Attempts, oldest first.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth:
            - messages:read
      summary: List the attempts of a delivery
      tags:
        - messages
  /v1/deliveries/{deliveryId}/cancel:
    post:
      description: |
        Stops further attempts. Queued or retry-scheduled work is cancelled at once; an attempt already in flight settles first and a 2xx still counts as success. Cancelling a finished delivery returns it unchanged.
      operationId: cancelDelivery
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
          description: The delivery after the request.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Cancel a delivery
      tags:
        - messages
  /v1/deliveries/{deliveryId}/replay:
    post:
      description: |
        Starts a new delivery cycle for the same message and endpoint under the endpoint's current configuration,
        keeping the `webhook-id`, so a receiver that already processed the message can acknowledge it without
        repeating its effect. Requires the payload to be retained and no active cycle for the pair. `Idempotency-Key`
        makes a repeated request return the same new cycle; a different key while a cycle is active is `409`.
        Sessions need the replay capability (owner, admin, developer); keys need `deliveries:replay`.
      operationId: replayDelivery
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - example: replay-2026-11-08-1
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
          description: The new delivery cycle.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth:
            - deliveries:replay
      summary: Replay a failed or cancelled delivery
      tags:
        - messages
  /v1/endpoints/{endpointId}:
    delete:
      description: |
        Retires the endpoint: it stops matching new events, its queued and retry-scheduled deliveries are cancelled with reason `endpoint_archived`, and an attempt already in flight finishes and records its outcome. History stays readable. Archiving an archived endpoint changes nothing.
      operationId: archiveEndpoint
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointArchived'
          description: The endpoint, archived, with how many unsent deliveries were cancelled.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Archive an endpoint
      tags:
        - endpoints
    get:
      description: The endpoint with its subscriptions and health. Health is `unknown` until an attempt was made, `unhealthy` while an episode of consecutive failures is open, and `stale` when nothing was observed for 15 minutes; paused and archived are separate fields.
      operationId: getEndpoint
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
          description: The endpoint.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Read an endpoint
      tags:
        - endpoints
    patch:
      description: |
        Changes the URL, description or subscriptions and increments the revision. Messages accepted after the change use the new configuration; attempts record the revision they were sent under. An archived endpoint is `409`.
      operationId: updateEndpoint
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEndpointRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
          description: The endpoint with its new revision.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Change an endpoint
      tags:
        - endpoints
  /v1/endpoints/{endpointId}/pause:
    post:
      description: Stops new attempts for the endpoint; in-flight attempts finish. Pausing a paused endpoint changes nothing.
      operationId: pauseEndpoint
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
          description: The endpoint, paused.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Pause an endpoint
      tags:
        - endpoints
  /v1/endpoints/{endpointId}/resume:
    post:
      description: |
        Lets the paused endpoint's backlog drain again under the retry policy. Cycles whose 24-hour deadline passed while paused stay expired. Resuming an endpoint that is not paused changes nothing.
      operationId: resumeEndpoint
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
          description: The endpoint, resumed.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Resume an endpoint
      tags:
        - endpoints
  /v1/endpoints/{endpointId}/rotate-secret:
    post:
      description: |
        Adds a new signing secret, returned once, and retires the previous ones after `retireIn` (default 24h; `0s` retires them at once). Until then every attempt carries one signature per active secret, so a receiver can switch keys without missing deliveries. Attempts record the secret version they used.
      operationId: rotateEndpointSecret
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateSecretRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretRotated'
          description: The new secret and when the previous ones stop signing.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Rotate the signing secret
      tags:
        - endpoints
  /v1/endpoints/{endpointId}/test:
    post:
      description: |
        Plans a `hookbeam.test` message addressed to this endpoint only, regardless of its subscriptions, and returns
        the message with its single delivery to follow. Owners, admins and developers; an archived endpoint is `409`.
      operationId: sendTestMessage
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestMessageSent'
          description: Planned; the worker attempts it next.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Send a test delivery to an endpoint
      tags:
        - endpoints
  /v1/environments:
    get:
      operationId: listEnvironments
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentList'
          description: Environments, oldest first.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: List the workspace's environments
      tags:
        - environments
    post:
      description: Owners and admins. Names are unique per workspace. A workspace gets a `development` environment on its first application if it has none.
      operationId: createEnvironment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
          description: The environment.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Create an environment
      tags:
        - environments
  /v1/environments/{environmentId}/applications:
    get:
      description: Archived applications are included with their `archivedAt`.
      operationId: listEnvironmentApplications
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'
          description: The applications, oldest first.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: List an environment's applications
      tags:
        - applications
    post:
      operationId: createEnvironmentApplication
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: The application.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Create a consumer application in an environment
      tags:
        - applications
  /v1/environments/{environmentId}/messages:
    get:
      operationId: listEnvironmentMessages
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
        - description: Exact event type.
          in: query
          name: type
          schema:
            type: string
        - description: Exact sender event id.
          in: query
          name: external_id
          schema:
            type: string
        - in: query
          name: accepted_after
          schema:
            format: date-time
            type: string
        - in: query
          name: accepted_before
          schema:
            format: date-time
            type: string
        - description: Keep messages with at least one delivery in this state.
          in: query
          name: outcome
          schema:
            enum:
              - queued
              - in_flight
              - retry_scheduled
              - succeeded
              - failed
              - cancelled
            type: string
        - in: query
          name: sort_by
          schema:
            default: id
            enum:
              - id
              - acceptedAt
            type: string
        - in: query
          name: sort_dir
          schema:
            default: asc
            enum:
              - asc
              - desc
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
          description: A page of messages with their delivery counts; payloads are never listed.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth:
            - messages:read
      summary: List an environment's messages across its applications
      tags:
        - messages
  /v1/environments/{environmentId}/overview:
    get:
      description: |
        Volume over the last 24 hours (accepted messages, succeeded deliveries, exhausted deliveries), the backlog and
        oldest pending delivery right now, and how the environment's endpoints are doing. `computedAt` says when the
        numbers were read and `healthObservedAt` when health last moved, so a lagging view is visible as such.
      operationId: getEnvironmentOverview
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
          description: The overview.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Overview tiles of an environment
      tags:
        - environments
  /v1/me:
    get:
      description: The caller as the control plane sees it, a user session or an API key. Profile fields live under `/v1/auth/me`.
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: The caller's identity
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      summary: Who am I
      tags:
        - me
  /v1/me/notification-preferences:
    get:
      description: Whether endpoint health alerts are also emailed to me. Defaults to on.
      operationId: getNotificationPreferences
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
          description: The preference.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: My alert email preference
      tags:
        - me
    put:
      operationId: updateNotificationPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
          description: The stored preference.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Set my alert email preference
      tags:
        - me
  /v1/members:
    get:
      description: Every member with the role Hookbeam applies. goauth members are developers unless made viewers.
      operationId: listMembers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
          description: Members, oldest first.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: List the workspace's members
      tags:
        - members
  /v1/members/{userId}/role:
    put:
      description: |
        Owners and admins only. Applies to goauth members; owners and admins are changed through `PUT /v1/auth/org/{orgId}/members/{userId}` first.
      operationId: setMemberRole
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMemberRoleRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: The member with the new role.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Make a member a developer or a viewer
      tags:
        - members
  /v1/messages/{messageId}:
    get:
      operationId: getMessage
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
          description: The message with one entry per delivery.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth:
            - messages:read
      summary: Inspect a message and its deliveries
      tags:
        - messages
  /v1/messages/{messageId}/payload:
    get:
      description: |
        The submitted bytes exactly as stored, for owners, admins, developers or a key with `payloads:read`; viewers
        are refused. Every permitted read is audited. A payload past its retention is `410`.
      operationId: getMessagePayload
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
          description: The payload, byte for byte.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "410":
          $ref: '#/components/responses/Gone'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth:
            - payloads:read
      summary: Read a message's payload
      tags:
        - messages
  /v1/notifications:
    get:
      description: Newest first. `unread=true` keeps only unread notices; `unread` in the response always counts every unread notice.
      operationId: listNotifications
      parameters:
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
        - in: query
          name: unread
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
          description: A page of notifications.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationFailed'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: List my notifications in the active workspace
      tags:
        - notifications
  /v1/notifications/{notificationId}/read:
    post:
      description: Idempotent; a notice already read is returned unchanged.
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: The notification.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Mark a notification read
      tags:
        - notifications
  /v1/workspaces/current/limits:
    get:
      description: |
        The data plane's limits: endpoints per application (a 21st is `422`), fan-out per message (`422` when an event
        type would reach more endpoints) and the backlog of non-terminal deliveries (a submission over it is `429`
        with `Retry-After`). Usage lists the backlog right now and every application's active endpoints.
      operationId: getWorkspaceLimits
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceLimits'
          description: Limits and usage.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Quotas and usage of the active workspace
      tags:
        - workspaces
servers:
  - description: Local development (`make dev`)
    url: http://localhost:8080
tags:
  - description: Liveness / readiness probes used by the load balancer and orchestrator.
    name: system
  - description: The authenticated caller.
    name: me
  - description: Sender credentials of a workspace.
    name: api-keys
  - description: Development and production environments of a workspace.
    name: environments
  - description: Consumer applications, one per recipient.
    name: applications
  - description: Who changed what.
    name: audit
  - description: Workspace members and the roles Hookbeam applies.
    name: members
  - description: Destination URLs, subscriptions and signing secrets.
    name: endpoints
  - description: Event submission, deliveries and attempts.
    name: messages
  - description: In-app notices about endpoint health.
    name: notifications
  - description: The active workspace as a whole.
    name: workspaces
