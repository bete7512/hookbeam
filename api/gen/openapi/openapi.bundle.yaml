          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
        - description: Case-insensitive match on the name.
          in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            default: id
            enum:
              - id
              - name
              - createdAt
              - lastUsedAt
            type: string
        - in: query
