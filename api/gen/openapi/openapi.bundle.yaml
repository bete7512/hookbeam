paths:
  /healthz:
    get:
      description: Reports that the process is up and serving; never checks dependencies, so a database blip does not get the task killed.
      operationId: getHealthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Process is alive.
      security: []
      summary: Liveness probe
      tags:
        - system
  /readyz:
    get:
      description: Pings every hard dependency (currently Postgres) and returns 503 with per-check detail when any is down, so the load balancer takes this replica out of rotation.
      operationId: getReadyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: All dependency checks passed.
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Readiness probe
      tags:
        - system
