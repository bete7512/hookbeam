      tags:
        - api-keys
    parameters:
      - $ref: '#/components/parameters/ApiKeyId'
  /v1/me:
    get:
      description: The caller as the control plane sees it, a user session or an API key. Profile fields live under `/v1/auth/me`.
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
