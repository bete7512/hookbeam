openapi: 3.0.3
paths:
  /healthz:
    get:
      description: Reports that the process is up and serving; never checks dependencies, so a database blip does not get the task killed.
      operationId: getHealthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Process is alive.
      security: []
      summary: Liveness probe
      tags:
        - system
  /readyz:
    get:
      description: Pings every hard dependency (currently Postgres) and returns 503 with per-check detail when any is down, so the load balancer takes this replica out of rotation.
      operationId: getReadyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: All dependency checks passed.
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Readiness probe
      tags:
        - system
  /v1/auth/forgot-password:
    post:
      description: Always answers 202 so the response does not reveal which emails are registered.
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      responses:
        "202":
          description: If the address belongs to an account, an email is on its way.
        "400":
          $ref: '#/components/responses/BadRequest'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Send a password reset email
      tags:
        - auth
  /v1/auth/google:
    get:
      description: Redirects to Google. State and the PKCE verifier travel in an HttpOnly cookie until the callback.
      operationId: googleLogin
      responses:
        "302":
          description: Redirect to Google's consent page.
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Start a Google login
      tags:
        - auth
  /v1/auth/google/callback:
    get:
      description: Google redirects here. Links the Google identity to the account with the same verified email, or creates one, and starts a session.
      operationId: googleCallback
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Tokens for the new session.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Finish a Google login
      tags:
        - auth
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Tokens for the new session.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Log in with email and password
      tags:
        - auth
  /v1/auth/logout:
    post:
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        "204":
          description: Session ended.
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: End the session of a refresh token
      tags:
        - auth
  /v1/auth/logout-all:
    post:
      description: Also invalidates every access token issued so far.
      operationId: logoutAll
      responses:
        "204":
          description: All sessions ended.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: End every session of the current user
      tags:
        - auth
  /v1/auth/refresh:
    post:
      description: The refresh token is single-use. Reusing one ends its session.
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: New tokens for the same session.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Exchange a refresh token for new tokens
      tags:
        - auth
  /v1/auth/resend-verification:
    post:
      description: Always answers 202 so the response does not reveal which emails are registered.
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      responses:
        "202":
          description: If the address belongs to an unverified account, an email is on its way.
        "400":
          $ref: '#/components/responses/BadRequest'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Send the verification email again
      tags:
        - auth
  /v1/auth/reset-password:
    post:
      description: The token is single-use and expires 30 minutes after it was sent. Every session of the account is ended.
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Set a new password with the token from the reset email
      tags:
        - auth
  /v1/auth/verify-email:
    post:
      description: The token is single-use and expires 30 minutes after it was sent.
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        "204":
          description: Email verified.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Confirm an email address with the token from the verification email
      tags:
        - auth
  /v1/me:
    get:
      description: Returns the profile of the user identified by the bearer token or access_token cookie; 401 when neither is present or valid.
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: The authenticated user.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Get the current user
      tags:
        - users
  /v1/users:
    get:
      description: Returns only the authenticated user; pagination, search, and sorting apply within that scope.
      operationId: listUsers
      parameters:
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
        - description: Case-insensitive match on email or name.
          in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            default: id
            enum:
              - id
              - email
              - name
              - createdAt
            type: string
        - in: query
          name: sort_dir
          schema:
            default: asc
            enum:
              - asc
              - desc
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
          description: A page of users.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: List the current user
      tags:
        - users
    post:
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: User created.
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Register a user
      tags:
        - users
  /v1/users/{id}:
    delete:
      operationId: deleteUser
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Delete your own user
      tags:
        - users
    get:
      operationId: getUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: The user.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Get your own user
      tags:
        - users
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: The updated user.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Update your own profile
      tags:
        - users
  /v1/users/{id}/password:
    put:
      description: Requires the current password. Signs the user out of every session.
      operationId: changeUserPassword
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Change your own password
      tags:
        - users
servers:
  - description: Local development (`make dev`)
    url: http://localhost:8080
tags:
  - description: Liveness / readiness probes used by the load balancer and orchestrator.
    name: system
  - description: Login, token refresh, logout, email verification, password reset and Google login.
    name: auth
  - description: User registration and profile.
    name: users
