          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
          description: A page of API keys.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: List the workspace's API keys
      tags:
        - api-keys
    post:
      description: Workspace owners and admins only. The response carries the secret once; store it, it cannot be retrieved again.
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
          description: The key, with its secret.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Create an API key
      tags:
        - api-keys
  /v1/api-keys/{id}:
    delete:
      description: Workspace owners and admins only. Revocation is immediate and permanent; a revoked key answers 404.
      operationId: revokeApiKey
      responses:
        "204":
          description: Revoked.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
