info:
  contact:
    name: Hookbeam maintainers
    url: https://github.com/bete7512/hookbeam
  description: |
    Errors are JSON `Error` objects; every response carries an `X-Request-Id` header.
    Routes under `/v1/auth` (signup, login, refresh, verification, password reset, Google login, profile) are served by goauth and merged into this document at runtime.
  license:
    name: MIT
  title: Hookbeam API
  version: 0.1.0
openapi: 3.0.3
paths:
  /healthz:
    get:
      description: Reports that the process is up and serving; never checks dependencies, so a database blip does not get the task killed.
      operationId: getHealthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Process is alive.
      security: []
      summary: Liveness probe
      tags:
        - system
  /readyz:
    get:
      description: Pings every hard dependency (Postgres and the delivery service) and returns 503 naming the failed one, so the load balancer takes this replica out of rotation.
      operationId: getReadyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: All dependency checks passed.
        "503":
          $ref: '#/components/responses/Unavailable'
      security: []
      summary: Readiness probe
      tags:
        - system
  /v1/api-keys:
    get:
      description: Keys of the active workspace, including revoked and expired ones; the secret is never returned.
      operationId: listApiKeys
      parameters:
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
        - description: Case-insensitive match on the name.
          in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            default: id
            enum:
              - id
              - name
              - createdAt
              - lastUsedAt
            type: string
        - in: query
          name: sort_dir
          schema:
            default: asc
            enum:
              - asc
              - desc
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
          description: A page of API keys.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: List the workspace's API keys
      tags:
        - api-keys
    post:
      description: Workspace owners and admins only. The response carries the secret once; store it, it cannot be retrieved again.
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
          description: The key, with its secret.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Create an API key
      tags:
        - api-keys
  /v1/api-keys/{id}:
    delete:
      description: Workspace owners and admins only. Revocation is immediate and permanent; a revoked key answers 404.
      operationId: revokeApiKey
      responses:
        "204":
          description: Revoked.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Revoke an API key
      tags:
        - api-keys
    parameters:
      - $ref: '#/components/parameters/ApiKeyId'
  /v1/applications:
    post:
      description: Registers an application in the active workspace. Names are unique per workspace.
      operationId: createApplication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: The application.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Create a consumer application
      tags:
        - applications
  /v1/applications/{applicationId}/endpoints:
    post:
      description: |
        Registers a destination URL and the event types it receives (none means every type). The response carries
        the signing secret once; receivers verify `webhook-signature` with it (Standard Webhooks, HMAC-SHA256).
      operationId: createEndpoint
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpointRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointCreated'
          description: The endpoint and its signing secret.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Register an endpoint
      tags:
        - endpoints
  /v1/applications/{applicationId}/messages:
    post:
      description: |
        Accepts an event for delivery to every endpoint of the application subscribed to its `type`. `202` means the
        delivery service committed the message and one delivery per endpoint; it says nothing about receivers yet.
        The exact request bytes become the outbound body. `Idempotency-Key` is required and scoped to the application:
        the same key with the same bytes returns the first result with `duplicate: true`; other bytes under the same key are `409`.
      operationId: submitMessage
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - example: order-817-shipped-v1
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSubmission'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAccepted'
          description: Accepted and durably planned.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - apiKeyAuth:
            - messages:write
      summary: Submit an event
      tags:
        - messages
  /v1/deliveries/{deliveryId}/attempts:
    get:
      operationId: listDeliveryAttempts
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptList'
          description: Attempts, oldest first.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth:
            - messages:read
      summary: List the attempts of a delivery
      tags:
        - messages
  /v1/deliveries/{deliveryId}/cancel:
    post:
      description: |
        Stops further attempts. Queued or retry-scheduled work is cancelled at once; an attempt already in flight settles first and a 2xx still counts as success. Cancelling a finished delivery returns it unchanged.
      operationId: cancelDelivery
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
          description: The delivery after the request.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Cancel a delivery
      tags:
        - messages
  /v1/deliveries/{deliveryId}/replay:
    post:
      description: |
        Starts a new delivery cycle for the same message and endpoint under the endpoint's current configuration,
        keeping the `webhook-id`, so a receiver that already processed the message can acknowledge it without
        repeating its effect. Requires the payload to be retained and no active cycle for the pair. `Idempotency-Key`
        makes a repeated request return the same new cycle; a different key while a cycle is active is `409`.
      operationId: replayDelivery
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - example: replay-2026-11-08-1
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
          description: The new delivery cycle.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Replay a failed or cancelled delivery
      tags:
        - messages
  /v1/endpoints/{endpointId}:
    delete:
      description: |
        Retires the endpoint: it stops matching new events, its queued and retry-scheduled deliveries are cancelled with reason `endpoint_archived`, and an attempt already in flight finishes and records its outcome. History stays readable. Archiving an archived endpoint changes nothing.
      operationId: archiveEndpoint
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointArchived'
          description: The endpoint, archived, with how many unsent deliveries were cancelled.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Archive an endpoint
      tags:
        - endpoints
    patch:
      description: |
        Changes the URL, description or subscriptions and increments the revision. Messages accepted after the change use the new configuration; attempts record the revision they were sent under. An archived endpoint is `409`.
      operationId: updateEndpoint
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEndpointRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
          description: The endpoint with its new revision.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Change an endpoint
      tags:
        - endpoints
  /v1/endpoints/{endpointId}/pause:
    post:
      description: Stops new attempts for the endpoint; in-flight attempts finish. Pausing a paused endpoint changes nothing.
      operationId: pauseEndpoint
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
          description: The endpoint, paused.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Pause an endpoint
      tags:
        - endpoints
  /v1/endpoints/{endpointId}/resume:
    post:
      description: |
        Lets the paused endpoint's backlog drain again under the retry policy. Cycles whose 24-hour deadline passed while paused stay expired. Resuming an endpoint that is not paused changes nothing.
      operationId: resumeEndpoint
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
          description: The endpoint, resumed.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Resume an endpoint
      tags:
        - endpoints
  /v1/endpoints/{endpointId}/rotate-secret:
    post:
      description: |
        Adds a new signing secret, returned once, and retires the previous ones after `retireIn` (default 24h; `0s` retires them at once). Until then every attempt carries one signature per active secret, so a receiver can switch keys without missing deliveries. Attempts record the secret version they used.
      operationId: rotateEndpointSecret
      parameters:
        - $ref: '#/components/parameters/EndpointId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateSecretRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretRotated'
          description: The new secret and when the previous ones stop signing.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Rotate the signing secret
      tags:
        - endpoints
  /v1/me:
    get:
      description: The caller as the control plane sees it, a user session or an API key. Profile fields live under `/v1/auth/me`.
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: The caller's identity
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      summary: Who am I
      tags:
        - me
  /v1/members:
    get:
      description: Every member with the role Hookbeam applies. goauth members are developers unless made viewers.
      operationId: listMembers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
          description: Members, oldest first.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: List the workspace's members
      tags:
        - members
  /v1/members/{userId}/role:
    put:
      description: |
        Owners and admins only. Applies to goauth members; owners and admins are changed through `PUT /v1/auth/org/{orgId}/members/{userId}` first.
      operationId: setMemberRole
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMemberRoleRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: The member with the new role.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
      security:
        - bearerAuth: []
        - cookieAuth: []
      summary: Make a member a developer or a viewer
      tags:
        - members
  /v1/messages/{messageId}:
    get:
      operationId: getMessage
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
          description: The message with one entry per delivery.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth:
            - messages:read
      summary: Inspect a message and its deliveries
      tags:
        - messages
servers:
  - description: Local development (`make dev`)
    url: http://localhost:8080
tags:
  - description: Liveness / readiness probes used by the load balancer and orchestrator.
    name: system
  - description: The authenticated caller.
    name: me
  - description: Sender credentials of a workspace.
    name: api-keys
  - description: Consumer applications, one per recipient.
    name: applications
  - description: Workspace members and the roles Hookbeam applies.
    name: members
  - description: Destination URLs, subscriptions and signing secrets.
    name: endpoints
  - description: Event submission, deliveries and attempts.
    name: messages
