me:
  get:
    operationId: getMe
    summary: Who am I
    description: The caller as the control plane sees it, a user session or an API key. Profile fields live under `/v1/auth/me`.
    tags: [me]
    security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: []
    responses:
      '200':
        description: The caller's identity
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Me'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

notificationPreferences:
  get:
    operationId: getNotificationPreferences
    tags: [me]
    summary: My alert email preference
    description: Whether endpoint health alerts are also emailed to me. Defaults to on.
    security:
      - bearerAuth: []
      - cookieAuth: []
    responses:
      '200':
        description: The preference.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
  put:
    operationId: updateNotificationPreferences
    tags: [me]
    summary: Set my alert email preference
    security:
      - bearerAuth: []
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotificationPreferences'
    responses:
      '200':
        description: The stored preference.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'

components:
  schemas:
    NotificationPreferences:
      type: object
      required: [emailAlerts]
      properties:
        emailAlerts:
          type: boolean
          description: Email me when an endpoint becomes unhealthy or recovers; in-app notices are always kept.
    Me:
      type: object
      required: [userId, authenticatedAt, expiresAt, methods]
      properties:
        userId:
          type: string
          nullable: true
          description: goauth user id; null for an API key
          example: 3f1c2a4e-9b7d-4c1e-8f2a-1d2e3f4a5b6c
        workspaceId:
          type: string
          nullable: true
          description: Active workspace, when one was selected at login or with `/v1/auth/org/switch`
        authenticatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the credential stops working; null for a key without expiry
        methods:
          type: array
          description: Authentication methods (`password`, `google`, `api_key`, ...)
          items:
            type: string
