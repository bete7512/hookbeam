# Destination endpoints of an application, with their subscriptions and signing secret.

applicationEndpoints:
  get:
    operationId: listApplicationEndpoints
    tags: [endpoints]
    summary: List an application's endpoints
    description: With subscriptions and health; archived endpoints are included with their `archivedAt`. `waiting` and `secrets` are only on the single-endpoint read.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: './applications.yaml#/components/parameters/ApplicationId'
    responses:
      '200':
        description: The endpoints, oldest first.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointList'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
  post:
    operationId: createEndpoint
    tags: [endpoints]
    summary: Register an endpoint
    description: |
      Registers a destination URL and the event types it receives (none means every type). The response carries
      the signing secret once; receivers verify `webhook-signature` with it (Standard Webhooks, HMAC-SHA256).
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: './applications.yaml#/components/parameters/ApplicationId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateEndpointRequest'
    responses:
      '201':
        description: The endpoint and its signing secret.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointCreated'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

endpointTest:
  post:
    operationId: sendTestMessage
    tags: [endpoints]
    summary: Send a test delivery to an endpoint
    description: |
      Plans a `hookbeam.test` message addressed to this endpoint only, regardless of its subscriptions, and returns
      the message with its single delivery to follow. Owners, admins and developers; an archived endpoint is `409`.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/EndpointId'
    responses:
      '202':
        description: Planned; the worker attempts it next.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestMessageSent'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '429':
        $ref: '../components/responses.yaml#/components/responses/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

endpointPause:
  post:
    operationId: pauseEndpoint
    tags: [endpoints]
    summary: Pause an endpoint
    description: Stops new attempts for the endpoint; in-flight attempts finish. Pausing a paused endpoint changes nothing.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/EndpointId'
    responses:
      '200':
        description: The endpoint, paused.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Endpoint'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

endpointRotateSecret:
  post:
    operationId: rotateEndpointSecret
    tags: [endpoints]
    summary: Rotate the signing secret
    description: >
      Adds a new signing secret, returned once, and retires the previous ones after `retireIn` (default 24h;
      `0s` retires them at once). Until then every attempt carries one signature per active secret, so a
      receiver can switch keys without missing deliveries. Attempts record the secret version they used.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/EndpointId'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RotateSecretRequest'
    responses:
      '200':
        description: The new secret and when the previous ones stop signing.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretRotated'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

endpointResume:
  post:
    operationId: resumeEndpoint
    tags: [endpoints]
    summary: Resume an endpoint
    description: >
      Lets the paused endpoint's backlog drain again under the retry policy. Cycles whose 24-hour deadline passed
      while paused stay expired. Resuming an endpoint that is not paused changes nothing.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/EndpointId'
    responses:
      '200':
        description: The endpoint, resumed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Endpoint'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

endpoint:
  get:
    operationId: getEndpoint
    tags: [endpoints]
    summary: Read an endpoint
    description: The endpoint with its subscriptions and health. Health is `unknown` until an attempt was made, `unhealthy` while an episode of consecutive failures is open, and `stale` when nothing was observed for 15 minutes; paused and archived are separate fields.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/EndpointId'
    responses:
      '200':
        description: The endpoint.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Endpoint'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
  patch:
    operationId: updateEndpoint
    tags: [endpoints]
    summary: Change an endpoint
    description: >
      Changes the URL, description or subscriptions and increments the revision. Messages accepted after the change
      use the new configuration; attempts record the revision they were sent under. An archived endpoint is `409`.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/EndpointId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateEndpointRequest'
    responses:
      '200':
        description: The endpoint with its new revision.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Endpoint'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
  delete:
    operationId: archiveEndpoint
    tags: [endpoints]
    summary: Archive an endpoint
    description: >
      Retires the endpoint: it stops matching new events, its queued and retry-scheduled deliveries are cancelled
      with reason `endpoint_archived`, and an attempt already in flight finishes and records its outcome.
      History stays readable. Archiving an archived endpoint changes nothing.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/EndpointId'
    responses:
      '200':
        description: The endpoint, archived, with how many unsent deliveries were cancelled.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointArchived'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

components:
  parameters:
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    CreateEndpointRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          example: https://receiver.example.com/hooks
        description:
          type: string
          maxLength: 500
        eventTypes:
          type: array
          description: Event types to receive; omit or leave empty for every type.
          items:
            type: string
            maxLength: 100
          example: [order.shipped]
    EndpointHealth:
      type: object
      required: [state, stale, consecutiveFailures]
      properties:
        state:
          type: string
          enum: [unknown, healthy, unhealthy]
        observedAt:
          type: string
          format: date-time
          nullable: true
          description: When the last counted attempt finished.
        stale:
          type: boolean
          description: True when the last observation is older than 15 minutes.
        consecutiveFailures:
          type: integer
          format: int32
    Endpoint:
      type: object
      required: [id, applicationId, url, description, revision, eventTypes, health, createdAt]
      properties:
        health:
          $ref: '#/components/schemas/EndpointHealth'
        id:
          type: integer
          format: int64
        applicationId:
          type: integer
          format: int64
        url:
          type: string
        description:
          type: string
        revision:
          type: integer
          format: int32
          description: Increments on every configuration change.
        eventTypes:
          type: array
          items:
            type: string
        pausedAt:
          type: string
          format: date-time
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        waiting:
          type: integer
          format: int32
          nullable: true
          description: Queued and retry-scheduled deliveries of the endpoint; only on the single-endpoint read, pause and resume.
        secrets:
          type: array
          description: Signing secret versions by fingerprint, newest first; only on the single-endpoint read, pause and resume.
          items:
            $ref: '#/components/schemas/EndpointSecretInfo'
    EndpointSecretInfo:
      type: object
      required: [version, fingerprint, createdAt]
      properties:
        version:
          type: integer
          format: int32
        fingerprint:
          type: string
          description: Short SHA-256 prefix of the secret, never the secret.
        createdAt:
          type: string
          format: date-time
        retireAt:
          type: string
          format: date-time
          nullable: true
          description: When this version stops signing; null while current.
    EndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
    TestMessageSent:
      type: object
      required: [message, delivery]
      properties:
        message:
          $ref: './messages.yaml#/components/schemas/Message'
        delivery:
          $ref: './messages.yaml#/components/schemas/Delivery'
    EndpointCreated:
      type: object
      required: [endpoint, signingSecret, secretVersion]
      properties:
        endpoint:
          $ref: '#/components/schemas/Endpoint'
        signingSecret:
          type: string
          description: Shown once. `whsec_` followed by the base64 key.
          example: whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw
        secretVersion:
          type: integer
          format: int32
    EndpointArchived:
      type: object
      required: [endpoint, cancelledDeliveries]
      properties:
        endpoint:
          $ref: '#/components/schemas/Endpoint'
        cancelledDeliveries:
          type: integer
          format: int64
          description: Queued and retry-scheduled deliveries cancelled by the archive.
    UpdateEndpointRequest:
      type: object
      description: Only the fields present change; an empty eventTypes list subscribes to every type.
      properties:
        expectedRevision:
          type: integer
          format: int32
          description: When set, the change applies only if the endpoint is still at this revision; otherwise `409`.
        url:
          type: string
          format: uri
          maxLength: 2048
        description:
          type: string
          maxLength: 500
        eventTypes:
          type: array
          items:
            type: string
            maxLength: 100
    RotateSecretRequest:
      type: object
      properties:
        retireIn:
          type: string
          description: How long the previous secrets keep signing, as a duration between 0s and 168h.
          default: 24h
          example: 24h
    SecretRotated:
      type: object
      required: [endpoint, signingSecret, secretVersion, retireAt]
      properties:
        endpoint:
          $ref: '#/components/schemas/Endpoint'
        signingSecret:
          type: string
          description: Shown once.
        secretVersion:
          type: integer
          format: int32
        retireAt:
          type: string
          format: date-time
          description: When the previous secrets stop signing.
