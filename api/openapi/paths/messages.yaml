# Event submission and inspection. Submission is for sender backends with an API key; reads accept sessions and keys.

applicationMessages:
  get:
    operationId: listApplicationMessages
    tags: [messages]
    summary: List an application's messages
    description: The explorer, paged with limit and offset, sorted by `sort_by` (default id) and `sort_dir` (default asc).
    security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: [messages:read]
    parameters:
      - $ref: './applications.yaml#/components/parameters/ApplicationId'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: type
        in: query
        required: false
        description: Exact event type.
        schema:
          type: string
      - name: external_id
        in: query
        required: false
        description: Exact sender event id.
        schema:
          type: string
      - name: accepted_after
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: accepted_before
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: outcome
        in: query
        required: false
        description: Keep messages with at least one delivery in this state.
        schema:
          type: string
          enum: [queued, in_flight, retry_scheduled, succeeded, failed, cancelled]
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum: [id, acceptedAt]
          default: id
      - name: sort_dir
        in: query
        required: false
        schema:
          type: string
          enum: [asc, desc]
          default: asc
    responses:
      '200':
        description: A page of messages with their delivery counts; payloads are never listed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageList'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
  post:
    operationId: submitMessage
    tags: [messages]
    summary: Submit an event
    description: |
      Accepts an event for delivery to every endpoint of the application subscribed to its `type`. `202` means the
      delivery service committed the message and one delivery per endpoint; it says nothing about receivers yet.
      The exact request bytes become the outbound body. A key bound to another application is `403`; a key over its
      submission rate is `429` with `Retry-After`. `Idempotency-Key` is required and scoped to the application:
      the same key with the same bytes returns the first result with `duplicate: true`; other bytes under the same key are `409`.
    security:
      - apiKeyAuth: [messages:write]
    parameters:
      - $ref: './applications.yaml#/components/parameters/ApplicationId'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        example: order-817-shipped-v1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageSubmission'
    responses:
      '202':
        description: Accepted and durably planned.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageAccepted'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '413':
        $ref: '../components/responses.yaml#/components/responses/PayloadTooLarge'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/components/responses/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

