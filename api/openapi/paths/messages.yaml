message:
  get:
    operationId: getMessage
    tags: [messages]
    summary: Inspect a message and its deliveries
    security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: [messages:read]
    parameters:
      - $ref: '#/components/parameters/MessageId'
    responses:
      '200':
        description: The message with one entry per delivery.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageDetail'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

messagePayload:
  get:
    operationId: getMessagePayload
    tags: [messages]
    summary: Read a message's payload
    description: |
      The submitted bytes exactly as stored, for owners, admins, developers or a key with `payloads:read`; viewers
      are refused. Every permitted read is audited. A payload past its retention is `410`.
    security:
      - bearerAuth: []
      - cookieAuth: []
      - apiKeyAuth: [payloads:read]
    parameters:
      - $ref: '#/components/parameters/MessageId'
    responses:
      '200':
        description: The payload, byte for byte.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '410':
        $ref: '../components/responses.yaml#/components/responses/Gone'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

components:
  parameters:
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    MessageSubmission:
      type: object
      description: The envelope receivers get, byte for byte. Only `type` is read by Hookbeam.
      required: [type]
      additionalProperties: true
      properties:
        type:
          type: string
          description: Event type the subscriptions match on.
          example: order.shipped
        external_id:
          type: string
          description: The sender's own event id, searchable; not a replacement for `Idempotency-Key`.
          example: order-817-shipped
        data:
          type: object
          additionalProperties: true
      example:
        type: order.shipped
        external_id: order-817-shipped
        data:
          order_id: "817"
          tracking_code: TRACK-817
    MessageAccepted:
      type: object
      required: [messageId, webhookId, status, deliveryCount, acceptedAt, duplicate]
      properties:
        messageId:
          type: integer
          format: int64
        webhookId:
          type: string
          description: The `webhook-id` receivers see; stable across retries and replays.
          example: msg_2b1c0f3a9d7e4c5b8a6f1e2d3c4b5a69
        status:
          type: string
          enum: [accepted]
        deliveryCount:
          type: integer
          format: int32
        acceptedAt:
          type: string
          format: date-time
        duplicate:
          type: boolean
          description: True when an earlier submission with the same key was returned.
    Message:
      type: object
      required: [id, webhookId, applicationId, environmentId, environmentKind, type, acceptedAt, deliveryCount]
      properties:
        id:
          type: integer
          format: int64
        webhookId:
          type: string
        applicationId:
          type: integer
          format: int64
        environmentId:
          type: integer
          format: int64
        environmentKind:
          $ref: './environments.yaml#/components/schemas/EnvironmentKind'
        type:
          type: string
        externalId:
          type: string
          nullable: true
        acceptedAt:
          type: string
          format: date-time
        deliveryCount:
          type: integer
          format: int32
        payloadExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the stored payload is dropped; payload reads and replays answer 410 after it.
    Delivery:
      type: object
      required: [id, messageId, endpointId, state, attemptCount, endpointRevision, deadlineAt, createdAt]
      properties:
        id:
          type: integer
          format: int64
        messageId:
          type: integer
          format: int64
        endpointId:
          type: integer
          format: int64
        state:
          type: string
          enum: [queued, in_flight, retry_scheduled, succeeded, failed, cancelled]
        attemptCount:
          type: integer
          format: int32
        endpointRevision:
          type: integer
          format: int32
          description: The endpoint configuration the cycle was planned under.
        dueAt:
          type: string
          format: date-time
          nullable: true
          description: Next attempt while queued or retry scheduled.
        deadlineAt:
          type: string
          format: date-time
        failureReason:
          type: string
          nullable: true
        replayOfDeliveryId:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    MessageDetail:
      type: object
      required: [message, deliveries]
      properties:
        message:
          $ref: '#/components/schemas/Message'
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
    DeliveryCounts:
      type: object
      required: [queued, inFlight, retryScheduled, succeeded, failed, cancelled]
      properties:
        queued:
          type: integer
          format: int32
        inFlight:
          type: integer
          format: int32
        retryScheduled:
          type: integer
          format: int32
        succeeded:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        cancelled:
          type: integer
          format: int32
    MessageSummary:
      type: object
      required: [message, deliveryCounts, payloadExpiresAt]
      properties:
        message:
          $ref: '#/components/schemas/Message'
        deliveryCounts:
          $ref: '#/components/schemas/DeliveryCounts'
        payloadExpiresAt:
          type: string
          format: date-time
    MessageList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageSummary'
        total:
          type: integer
