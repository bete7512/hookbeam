login:
  post:
    operationId: login
    tags: [auth]
    summary: Log in with email and password
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    responses:
      '200':
        description: Tokens for the new session.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenResponse'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '429':
        $ref: '../components/responses.yaml#/components/responses/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

refresh:
  post:
    operationId: refreshToken
    tags: [auth]
    summary: Exchange a refresh token for new tokens
    description: The refresh token is single-use. Reusing one ends its session.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshTokenRequest'
    responses:
      '200':
        description: New tokens for the same session.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenResponse'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '429':
        $ref: '../components/responses.yaml#/components/responses/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

logout:
  post:
    operationId: logout
    tags: [auth]
    summary: End the session of a refresh token
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefreshTokenRequest'
    responses:
      '204':
        description: Session ended.
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '429':
        $ref: '../components/responses.yaml#/components/responses/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

logoutAll:
  post:
    operationId: logoutAll
    tags: [auth]
    summary: End every session of the current user
    description: Also invalidates every access token issued so far.
    security:
      - bearerAuth: []
      - cookieAuth: []
    responses:
      '204':
        description: All sessions ended.
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '429':
        $ref: '../components/responses.yaml#/components/responses/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

verifyEmail:
  post:
    operationId: verifyEmail
    tags: [auth]
    summary: Confirm an email address with the token from the verification email
    description: The token is single-use and expires 30 minutes after it was sent.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenRequest'
    responses:
      '204':
        description: Email verified.
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '429':
        $ref: '../components/responses.yaml#/components/responses/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

resendVerification:
  post:
    operationId: resendVerification
    tags: [auth]
    summary: Send the verification email again
    description: Always answers 202 so the response does not reveal which emails are registered.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailRequest'
    responses:
      '202':
        description: If the address belongs to an unverified account, an email is on its way.
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/components/responses/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

forgotPassword:
  post:
    operationId: forgotPassword
    tags: [auth]
    summary: Send a password reset email
    description: Always answers 202 so the response does not reveal which emails are registered.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailRequest'
    responses:
      '202':
        description: If the address belongs to an account, an email is on its way.
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/components/responses/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

resetPassword:
  post:
    operationId: resetPassword
    tags: [auth]
    summary: Set a new password with the token from the reset email
    description: The token is single-use and expires 30 minutes after it was sent. Every session of the account is ended.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResetPasswordRequest'
    responses:
      '204':
        description: Password changed.
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '429':
        $ref: '../components/responses.yaml#/components/responses/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

googleLogin:
  get:
    operationId: googleLogin
    tags: [auth]
    summary: Start a Google login
    description: Redirects to Google. State and the PKCE verifier travel in an HttpOnly cookie until the callback.
    security: []
    responses:
      '302':
        description: Redirect to Google's consent page.
      '429':
        $ref: '../components/responses.yaml#/components/responses/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

googleCallback:
  get:
    operationId: googleCallback
    tags: [auth]
    summary: Finish a Google login
    description: Google redirects here. Links the Google identity to the account with the same verified email, or creates one, and starts a session.
    security: []
    parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Tokens for the new session.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenResponse'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '429':
        $ref: '../components/responses.yaml#/components/responses/TooManyRequests'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

components:
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ada@example.com
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token from the email link.

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: ada@example.com

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: The token from the email link.
        newPassword:
          type: string
          format: password
          minLength: 12

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
          example: 900
