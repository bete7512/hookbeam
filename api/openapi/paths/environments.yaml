# Environments sit between a workspace and its applications: development and production never share one.

environments:
  get:
    operationId: listEnvironments
    tags: [environments]
    summary: List the workspace's environments
    security:
      - bearerAuth: []
      - cookieAuth: []
    responses:
      '200':
        description: Environments, oldest first.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentList'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
  post:
    operationId: createEnvironment
    tags: [environments]
    summary: Create an environment
    description: Owners and admins. Names are unique per workspace. A workspace gets a `development` environment on its first application if it has none.
    security:
      - bearerAuth: []
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateEnvironmentRequest'
    responses:
      '201':
        description: The environment.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Environment'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

environmentOverview:
  get:
    operationId: getEnvironmentOverview
    tags: [environments]
    summary: Overview tiles of an environment
    description: |
      Volume over the last 24 hours (accepted messages, succeeded deliveries, exhausted deliveries), the backlog and
      oldest pending delivery right now, and how the environment's endpoints are doing. `computedAt` says when the
      numbers were read and `healthObservedAt` when health last moved, so a lagging view is visible as such.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/EnvironmentId'
    responses:
      '200':
        description: The overview.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Overview'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

environmentApplications:
  get:
    operationId: listEnvironmentApplications
    tags: [applications]
    summary: List an environment's applications
    description: Archived applications are included with their `archivedAt`.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/EnvironmentId'
    responses:
      '200':
        description: The applications, oldest first.
        content:
          application/json:
            schema:
              $ref: './applications.yaml#/components/schemas/ApplicationList'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
  post:
    operationId: createEnvironmentApplication
    tags: [applications]
    summary: Create a consumer application in an environment
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/EnvironmentId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './applications.yaml#/components/schemas/CreateApplicationRequest'
    responses:
      '201':
        description: The application.
        content:
          application/json:
            schema:
              $ref: './applications.yaml#/components/schemas/Application'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

components:
  parameters:
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    EnvironmentKind:
      type: string
      enum: [development, production]
    Environment:
      type: object
      required: [id, workspaceId, name, kind, createdBy, createdAt]
      properties:
        id:
          type: integer
          format: int64
        workspaceId:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/EnvironmentKind'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    EnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Environment'
    CreateEnvironmentRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: production
        kind:
          $ref: '#/components/schemas/EnvironmentKind'
    OverviewBucket:
      type: object
      required: [hour, accepted, succeeded, failed]
      properties:
        hour:
          type: string
          format: date-time
          description: Start of the hour.
        accepted:
          type: integer
          format: int64
        succeeded:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
    Overview:
      type: object
      required: [since, computedAt, accepted, succeeded, exhausted, backlog, endpoints, series]
      properties:
        series:
          type: array
          description: One bucket per hour of the window, oldest first.
          items:
            $ref: '#/components/schemas/OverviewBucket'
        since:
          type: string
          format: date-time
          description: Start of the window the volume counts cover.
        computedAt:
          type: string
          format: date-time
          description: When the numbers were read.
        accepted:
          type: integer
          format: int64
          description: Messages accepted in the window.
        succeeded:
          type: integer
          format: int64
          description: Deliveries that succeeded in the window.
        exhausted:
          type: integer
          format: int64
          description: Deliveries that gave up after the last retry in the window.
        backlog:
          type: integer
          format: int64
          description: Queued and retry-scheduled deliveries right now.
        oldestPendingDueAt:
          type: string
          format: date-time
          nullable: true
          description: When the oldest pending delivery was due; its age is the oldest pending age.
        endpoints:
          type: object
          required: [healthy, unhealthy, unknown]
          properties:
            healthy:
              type: integer
              format: int32
            unhealthy:
              type: integer
              format: int32
            unknown:
              type: integer
              format: int32
            observedAt:
              type: string
              format: date-time
              nullable: true
              description: The newest health observation among the endpoints.
