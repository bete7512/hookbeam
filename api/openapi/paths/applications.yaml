# Consumer applications: one recipient boundary inside the workspace. Stored by the delivery service; the control plane forwards.

applications:
  post:
    operationId: createApplication
    tags: [applications]
    summary: Create a consumer application in the development environment
    description: Registers an application in the active workspace. Names are unique per workspace.
    security:
      - bearerAuth: []
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateApplicationRequest'
    responses:
      '201':
        description: The application.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

application:
  get:
    operationId: getApplication
    tags: [applications]
    summary: Read an application
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    responses:
      '200':
        description: The application.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'
  patch:
    operationId: updateApplication
    tags: [applications]
    summary: Change an application's settings
    description: Owners and admins. `responsePreviewsEnabled` lets readers of payloads also see attempt response previews.
    security:
      - bearerAuth: []
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateApplicationRequest'
    responses:
      '200':
        description: The application after the change.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '422':
        $ref: '../components/responses.yaml#/components/responses/ValidationFailed'
      '503':
        $ref: '../components/responses.yaml#/components/responses/Unavailable'

components:
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    CreateApplicationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Customer A
    ApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Application'
    UpdateApplicationRequest:
      type: object
      properties:
        responsePreviewsEnabled:
          type: boolean
          description: Expose attempt response previews to callers allowed to read payloads.
    Application:
      type: object
      required: [id, workspaceId, environmentId, environmentKind, name, createdBy, responsePreviewsEnabled, createdAt]
      properties:
        id:
          type: integer
          format: int64
        workspaceId:
          type: string
        environmentId:
          type: integer
          format: int64
        environmentKind:
          $ref: './environments.yaml#/components/schemas/EnvironmentKind'
        name:
          type: string
        createdBy:
          type: string
          description: goauth user id of the creator
        responsePreviewsEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
