# Root OpenAPI document. Run `make gen-openapi` after any change.
openapi: 3.0.3

info:
  title: Hookbeam API
  version: 0.1.0
  description: |
    Errors are JSON `Error` objects; every response carries an `X-Request-Id` header.
    Routes under `/v1/auth` (signup, login, refresh, verification, password reset, Google login, profile) are served by goauth and merged into this document at runtime.
  contact:
    name: Hookbeam maintainers
    url: https://github.com/bete7512/hookbeam
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development (`make dev`)

tags:
  - name: system
    description: Liveness / readiness probes used by the load balancer and orchestrator.
  - name: me
    description: The authenticated caller.
  - name: api-keys
    description: Sender credentials of a workspace.
  - name: applications
    description: Consumer applications, one per recipient.
  - name: endpoints
    description: Destination URLs, subscriptions and signing secrets.
  - name: messages
    description: Event submission, deliveries and attempts.

paths:
  /healthz:
    $ref: './paths/health.yaml#/healthz'
  /readyz:
    $ref: './paths/health.yaml#/readyz'
  /v1/me:
    $ref: './paths/me.yaml#/me'
  /v1/api-keys:
    $ref: './paths/api_keys.yaml#/apiKeys'
  /v1/api-keys/{id}:
    $ref: './paths/api_keys.yaml#/apiKey'
  /v1/applications:
    $ref: './paths/applications.yaml#/applications'
  /v1/applications/{applicationId}/endpoints:
    $ref: './paths/endpoints.yaml#/applicationEndpoints'
  /v1/applications/{applicationId}/messages:
    $ref: './paths/messages.yaml#/applicationMessages'
  /v1/endpoints/{endpointId}/pause:
    $ref: './paths/endpoints.yaml#/endpointPause'
  /v1/messages/{messageId}:
    $ref: './paths/messages.yaml#/message'
  /v1/deliveries/{deliveryId}/attempts:
    $ref: './paths/deliveries.yaml#/deliveryAttempts'
  /v1/deliveries/{deliveryId}/cancel:
    $ref: './paths/deliveries.yaml#/deliveryCancel'
  /v1/deliveries/{deliveryId}/replay:
    $ref: './paths/deliveries.yaml#/deliveryReplay'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: goauth_access_hookbeam
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: hb_...
      description: A workspace API key sent as a bearer token; keys start with `hb_`.
