<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-label="One event: your application posts it, the control plane calls the delivery service, the delivery worker claims it from Postgres, signs and posts it to the customer endpoint.">
<style>
  :root { --ink:#1e293b; --box:#f8fafc; --muted:#64748b; --hi:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e2e8f0; --box:#1e293b; --muted:#94a3b8; --hi:#60a5fa; } }
  text { font: 13px system-ui, sans-serif; fill: var(--ink); text-anchor: middle; }
  .t { font-weight: 600; font-size: 14px; }
  .s, .l { font-size: 12px; fill: var(--muted); }
  rect { fill: var(--box); stroke: var(--ink); stroke-width: 1.5; }
  line { stroke: var(--ink); stroke-width: 1.5; }
  #a path { fill: var(--ink); }
  .n:hover rect { stroke: var(--hi); stroke-width: 3; }
  .n:hover .s { fill: var(--hi); }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
<text x="400" y="40" class="t" style="font-size:16px">One event, end to end</text>
<g class="e"><line x1="172" y1="185" x2="268" y2="185" marker-end="url(#a)"/><text x="220" y="174" class="l" style="text-anchor:middle">1  POST event</text></g>
<g class="e"><line x1="442" y1="185" x2="538" y2="185" marker-end="url(#a)"/><text x="490" y="174" class="l" style="text-anchor:middle">2  gRPC · mTLS</text></g>
<g class="e"><line x1="355" y1="222" x2="355" y2="318" marker-end="url(#a)"/></g>
<g class="e"><line x1="625" y1="222" x2="625" y2="318" marker-end="url(#a)"/><text x="612" y="275" class="l" style="text-anchor:end">3  message + deliveries</text></g>
<g class="e"><line x1="727" y1="350" x2="808" y2="350" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="760" y="341" class="l" style="text-anchor:middle">outbox</text></g>
<g class="e"><line x1="895" y1="318" x2="895" y2="222" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="905" y="275" class="l" style="text-anchor:start">wake-up</text></g>
<g class="e"><line x1="727" y1="328" x2="808" y2="224" marker-end="url(#a)"/><text x="742" y="302" class="l" style="text-anchor:end">4  claim due</text></g>
<g class="e"><line x1="870" y1="148" x2="870" y2="92" marker-end="url(#a)"/><text x="858" y="125" class="l" style="text-anchor:end">5  signed POST</text></g>
<g class="e"><line x1="920" y1="92" x2="920" y2="148" marker-end="url(#a)"/><text x="932" y="125" class="l" style="text-anchor:start">2xx or retry</text></g>
<g class="n"><title>Your backend posts each event once, with an API key and an Idempotency-Key.</title><rect x="20" y="150" width="150" height="70" rx="8"/><text x="95.0" y="179" class="t">Your application</text><text x="95.0" y="199" class="s">posts event + API key</text></g><g class="n"><title>Authenticates the key, resolves the workspace, calls the delivery service over gRPC with mTLS.</title><rect x="270" y="150" width="170" height="70" rx="8"/><text x="355.0" y="179" class="t">Hookbeam API</text><text x="355.0" y="199" class="s">control plane · api/</text></g><g class="n"><title>The control plane's own database.</title><rect x="270" y="320" width="170" height="60" rx="8"/><text x="355.0" y="349" class="t">Postgres</text><text x="355.0" y="369" class="s">users · workspaces · keys</text></g><g class="n"><title>Writes the message, one delivery per subscribed endpoint and a wake-up row in one transaction.</title><rect x="540" y="150" width="170" height="70" rx="8"/><text x="625.0" y="179" class="t">Delivery service</text><text x="625.0" y="199" class="s">data plane · delivery/</text></g><g class="n"><title>The data plane's own database; due_at is the schedule.</title><rect x="525" y="320" width="200" height="60" rx="8"/><text x="625.0" y="349" class="t">Postgres</text><text x="625.0" y="369" class="s">messages · deliveries · attempts</text></g><g class="n"><title>The queue only wakes workers; Postgres decides what is due.</title><rect x="810" y="320" width="170" height="60" rx="8"/><text x="895.0" y="349" class="t">SNS + SQS</text><text x="895.0" y="369" class="s">wake-ups only</text></g><g class="n"><title>Claims due deliveries under a lease, signs with Standard Webhooks, posts through an SSRF-guarded client, records the attempt.</title><rect x="810" y="150" width="170" height="70" rx="8"/><text x="895.0" y="179" class="t">Delivery worker</text><text x="895.0" y="199" class="s">claims · signs · posts</text></g><g class="n"><title>Any HTTPS receiver. 2xx succeeds; other failures retry with backoff, eight attempts in 24 hours.</title><rect x="810" y="20" width="170" height="70" rx="8"/><text x="895.0" y="49" class="t">Customer endpoint</text><text x="895.0" y="69" class="s">verifies the signature</text></g>
</svg>