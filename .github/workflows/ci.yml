name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of the same PR/branch; never cancel a run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  OAPI_CODEGEN_VERSION: v2.8.0
  MOCKGEN_VERSION: v0.6.0
  GOVULNCHECK_VERSION: v1.8.0
  BUF_VERSION: v1.72.0
  PROTOC_GEN_GO_VERSION: v1.36.6
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      # The integration tag is a superset: untagged files are always in the build set.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          args: --build-tags integration ./...

  gen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: make console-install
      - name: Install generators
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@${OAPI_CODEGEN_VERSION}
          go install go.uber.org/mock/mockgen@${MOCKGEN_VERSION}
          go install github.com/bufbuild/buf/cmd/buf@${BUF_VERSION}
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}
      - run: make gen-check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hookbeam_test
          POSTGRES_PASSWORD: hookbeam_test
          POSTGRES_DB: hookbeam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hookbeam_test -d hookbeam_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test
      # LocalStack needs the init script from the checkout, so it comes from compose rather than a service container.
      - run: docker compose --profile queue up -d --wait localstack
      - run: make test-integration
        env:
          TEST_DATABASE_URL: postgres://hookbeam_test:hookbeam_test@localhost:5432/hookbeam_test?sslmode=disable
          EVENTS_AWS_ENDPOINT_URL: http://localhost:4566
          EVENTS_AWS_REGION: us-east-1
          EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:hookbeam-events
          EVENTS_QUEUE_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/hookbeam-worker
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
      - if: always()
        run: docker compose --profile queue down -v

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: make console-install
      - run: make console-check
      - run: make console-build

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - run: make vuln

  image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - { app: api, target: api }
          - { app: api, target: worker }
          - { app: delivery, target: server }
          - { app: delivery, target: worker }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/cmd/${{ matrix.target }}/Dockerfile
          push: false
          load: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: hookbeam-${{ matrix.app }}-${{ matrix.target }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hookbeam-${{ matrix.app }}-${{ matrix.target }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
