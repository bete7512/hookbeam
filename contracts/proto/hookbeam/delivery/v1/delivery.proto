syntax = "proto3";

// The contract between the control plane (api/) and the data plane (delivery/).
// Every call carries the workspace it acts for in metadata (x-hookbeam-workspace-id),
// the acting user when there is one (x-hookbeam-actor-id) and the request id (x-request-id);
// the server scopes every read and write to that workspace.
package hookbeam.delivery.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/bete7512/hookbeam/contracts/gen/go/hookbeam/delivery/v1;deliveryv1";

// DeliveryService owns applications, endpoints, messages, deliveries and attempts.
service DeliveryService {
  // CreateEnvironment adds a development or production environment to the caller's workspace.
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse);
  // ListEnvironments returns the caller's workspace's environments.
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  // CreateApplication registers a consumer application in an environment of the caller's workspace.
  rpc CreateApplication(CreateApplicationRequest) returns (CreateApplicationResponse);
  // UpdateApplication changes an application's settings; the change is audited.
  rpc UpdateApplication(UpdateApplicationRequest) returns (UpdateApplicationResponse);
  rpc GetApplication(GetApplicationRequest) returns (GetApplicationResponse);
  // ListApplications returns an environment's applications, archived ones included.
  rpc ListApplications(ListApplicationsRequest) returns (ListApplicationsResponse);
  // ListEndpoints returns an application's endpoints with subscriptions and health, archived ones included.
  rpc ListEndpoints(ListEndpointsRequest) returns (ListEndpointsResponse);
  // GetOverview reads an environment's overview tiles.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  // SendTestMessage plans a hookbeam.test message for one endpoint only and returns it with its delivery.
  rpc SendTestMessage(SendTestMessageRequest) returns (SendTestMessageResponse);
  // CreateEndpoint registers a destination with its subscriptions and returns its signing secret once.
  rpc CreateEndpoint(CreateEndpointRequest) returns (CreateEndpointResponse);
  // GetEndpoint reads one endpoint with its subscriptions and health.
  rpc GetEndpoint(GetEndpointRequest) returns (GetEndpointResponse);
  // GetWorkspaceLimits returns the workspace's quotas and where it stands against them.
  rpc GetWorkspaceLimits(GetWorkspaceLimitsRequest) returns (GetWorkspaceLimitsResponse);
  // GetHealthEpisode reads one health episode with its endpoint, so a consumer can tell whether it is still open.
  rpc GetHealthEpisode(GetHealthEpisodeRequest) returns (GetHealthEpisodeResponse);
  // PauseEndpoint stops new attempts for an endpoint; in-flight attempts finish.
  rpc PauseEndpoint(PauseEndpointRequest) returns (PauseEndpointResponse);
  // AcceptMessage durably accepts an event and plans one delivery per subscribed endpoint.
  rpc AcceptMessage(AcceptMessageRequest) returns (AcceptMessageResponse);
  // GetMessage returns a message with its deliveries.
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
  // GetMessagePayload returns the retained bytes exactly as submitted and audits the read; an expired payload
  // is FAILED_PRECONDITION.
  rpc GetMessagePayload(GetMessagePayloadRequest) returns (GetMessagePayloadResponse);
  // ListMessages pages a workspace's messages for the explorer, with delivery counts per state and never the payload.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  // ListAttempts returns every attempt of a delivery, oldest first.
  rpc ListAttempts(ListAttemptsRequest) returns (ListAttemptsResponse);
  // ReplayDelivery starts a new delivery cycle for a failed or cancelled delivery.
  rpc ReplayDelivery(ReplayDeliveryRequest) returns (ReplayDeliveryResponse);
  // UpdateEndpoint changes the URL, description or subscriptions and bumps the revision; later accepted
  // messages use the new configuration, existing deliveries keep the revision they were planned under.
  rpc UpdateEndpoint(UpdateEndpointRequest) returns (UpdateEndpointResponse);
  // RotateEndpointSecret adds a new signing secret, returned once, and retires the previous ones after retire_in;
  // until then every attempt carries a signature per active secret.
  rpc RotateEndpointSecret(RotateEndpointSecretRequest) returns (RotateEndpointSecretResponse);
  // ResumeEndpoint lets a paused endpoint's backlog drain again; cycles past their deadline stay expired.
  rpc ResumeEndpoint(ResumeEndpointRequest) returns (ResumeEndpointResponse);
  // ArchiveEndpoint retires an endpoint: no more matching, no more claims, unsent cycles are cancelled.
  rpc ArchiveEndpoint(ArchiveEndpointRequest) returns (ArchiveEndpointResponse);
  // ArchiveApplication retires an application: it stops accepting events, its unarchived endpoints are archived
  // and their unsent deliveries cancelled, in one transaction. Archiving twice changes nothing.
  rpc ArchiveApplication(ArchiveApplicationRequest) returns (ArchiveApplicationResponse);
  // ListAuditEvents pages the data plane's audit trail for the caller's workspace, newest first.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  // CancelDelivery stops further attempts: unclaimed work is cancelled now, an in-flight attempt settles first.
  // Cancelling a finished delivery returns it unchanged.
  rpc CancelDelivery(CancelDeliveryRequest) returns (CancelDeliveryResponse);
}

message Application {
  int64 id = 1;
  string workspace_id = 2;
  string name = 3;
  string created_by = 4;
  google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp archived_at = 6;
  int64 environment_id = 7;
  // environment_kind is development or production.
  string environment_kind = 8;
  // response_previews_enabled exposes attempt response previews to readers allowed to see payloads.
  bool response_previews_enabled = 9;
}

message GetApplicationRequest {
  int64 application_id = 1;
}

message GetApplicationResponse {
  Application application = 1;
}

message ListApplicationsRequest {
  int64 environment_id = 1;
}

message ListApplicationsResponse {
  repeated Application applications = 1;
}

message ListEndpointsRequest {
  int64 application_id = 1;
}

message ListEndpointsResponse {
  repeated Endpoint endpoints = 1;
}

message GetOverviewRequest {
  int64 environment_id = 1;
}

// Overview carries the numbers behind the overview tiles. Volume counts cover the window since `since`;
// backlog, oldest pending and health are as of computed_at.
message Overview {
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp computed_at = 2;
  int64 accepted = 3;
  int64 succeeded = 4;
  int64 exhausted = 5;
  int64 backlog = 6;
  optional google.protobuf.Timestamp oldest_pending_due_at = 7;
  int32 endpoints_healthy = 8;
  int32 endpoints_unhealthy = 9;
  int32 endpoints_unknown = 10;
  optional google.protobuf.Timestamp health_observed_at = 11;
  // series holds one bucket per hour of the window, oldest first.
  repeated OverviewBucket series = 12;
}

// OverviewBucket is one hour of the overview window.
message OverviewBucket {
  google.protobuf.Timestamp hour = 1;
  int64 accepted = 2;
  int64 succeeded = 3;
  int64 failed = 4;
}

message GetOverviewResponse {
  Overview overview = 1;
}

message SendTestMessageRequest {
  int64 endpoint_id = 1;
}

message SendTestMessageResponse {
  Message message = 1;
  Delivery delivery = 2;
}

message UpdateApplicationRequest {
  int64 application_id = 1;
  optional bool response_previews_enabled = 2;
}

message UpdateApplicationResponse {
  Application application = 1;
}

message CreateApplicationRequest {
  string name = 1;
  // environment_id selects the environment; unset means the workspace's development environment.
  optional int64 environment_id = 2;
}

message Environment {
  int64 id = 1;
  string workspace_id = 2;
  string name = 3;
  // kind is development or production.
  string kind = 4;
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateEnvironmentRequest {
  string name = 1;
  string kind = 2;
}

message CreateEnvironmentResponse {
  Environment environment = 1;
}

message ListEnvironmentsRequest {}

message ListEnvironmentsResponse {
  repeated Environment environments = 1;
}

message CreateApplicationResponse {
  Application application = 1;
}

message Endpoint {
  int64 id = 1;
  int64 application_id = 2;
  string url = 3;
  string description = 4;
  // revision increments on every configuration change; deliveries record the revision they were planned under.
  int32 revision = 5;
  // event_types the endpoint receives; empty means every event type.
  repeated string event_types = 6;
  optional google.protobuf.Timestamp paused_at = 7;
  optional google.protobuf.Timestamp archived_at = 8;
  google.protobuf.Timestamp created_at = 9;
  EndpointHealth health = 10;
  // waiting is how many deliveries are queued or scheduled for the endpoint; set on detail reads only.
  optional int32 waiting = 11;
  // secrets lists the signing secret versions by fingerprint, newest first; set on detail reads only.
  repeated EndpointSecretInfo secrets = 12;
}

// EndpointSecretInfo describes a secret version without the secret: its fingerprint and lifetime.
message EndpointSecretInfo {
  int32 version = 1;
  string fingerprint = 2;
  google.protobuf.Timestamp created_at = 3;
  optional google.protobuf.Timestamp retire_at = 4;
}

// EndpointHealth is what attempts say about the destination; paused and archived are separate fields.
message EndpointHealth {
  // state is unknown (never attempted), healthy or unhealthy (an episode of consecutive failures is open).
  string state = 1;
  optional google.protobuf.Timestamp observed_at = 2;
  // stale is true when the last observation is older than the staleness window.
  bool stale = 3;
  int32 consecutive_failures = 4;
}

message GetEndpointRequest {
  int64 endpoint_id = 1;
}

// HealthEpisode is one stretch of consecutive failures; resolved_at is unset while it is open.
message HealthEpisode {
  int64 id = 1;
  int64 endpoint_id = 2;
  int32 revision = 3;
  int32 consecutive_failures = 4;
  google.protobuf.Timestamp opened_at = 5;
  optional google.protobuf.Timestamp resolved_at = 6;
}

message GetWorkspaceLimitsRequest {}

message WorkspaceLimits {
  int32 endpoints_per_application = 1;
  int32 fanout_per_message = 2;
  // backlog_per_workspace caps the non-terminal deliveries a workspace may hold; over it, AcceptMessage is RESOURCE_EXHAUSTED.
  int32 backlog_per_workspace = 3;
}

message ApplicationEndpointCount {
  int64 application_id = 1;
  string name = 2;
  int32 endpoints = 3;
}

message GetWorkspaceLimitsResponse {
  WorkspaceLimits limits = 1;
  // backlog is the workspace's non-terminal deliveries right now, counted up to the cap.
  int32 backlog = 2;
  repeated ApplicationEndpointCount applications = 3;
  Retention retention = 4;
}

// Retention is how long the data plane keeps what it stores, as configured.
message Retention {
  // payload is how long submitted bytes stay readable and replayable.
  google.protobuf.Duration payload = 1;
  // idempotency_window is how long a submission's Idempotency-Key is remembered.
  google.protobuf.Duration idempotency_window = 2;
  // audit is how long audit events are kept.
  google.protobuf.Duration audit = 3;
}

message GetHealthEpisodeRequest {
  int64 episode_id = 1;
}

message GetHealthEpisodeResponse {
  HealthEpisode episode = 1;
  Endpoint endpoint = 2;
}

message GetEndpointResponse {
  Endpoint endpoint = 1;
}

message CreateEndpointRequest {
  int64 application_id = 1;
  string url = 2;
  string description = 3;
  repeated string event_types = 4;
}

message CreateEndpointResponse {
  Endpoint endpoint = 1;
  // signing_secret is returned once; only its encrypted form is stored.
  string signing_secret = 2;
  int32 secret_version = 3;
}

message PauseEndpointRequest {
  int64 endpoint_id = 1;
}

message PauseEndpointResponse {
  Endpoint endpoint = 1;
}

message AcceptMessageRequest {
  int64 application_id = 1;
  string event_type = 2;
  // idempotency_key scopes to the application; the same key with the same bytes returns the first result.
  string idempotency_key = 3;
  optional string sender_event_id = 4;
  // payload is the exact JSON the sender submitted and the exact body receivers get.
  bytes payload = 5;
}

message AcceptMessageResponse {
  Message message = 1;
  // duplicate is true when an earlier submission with the same key was returned instead of a new message.
  bool duplicate = 2;
}

message Message {
  int64 id = 1;
  // public_id is the webhook-id receivers see; it survives retries and replays.
  string public_id = 2;
  int64 application_id = 3;
  string event_type = 4;
  optional string sender_event_id = 5;
  google.protobuf.Timestamp accepted_at = 6;
  int32 delivery_count = 7;
  int64 environment_id = 8;
  string environment_kind = 9;
  // payload_expires_at is when the stored payload is dropped; reads and replays answer 410 after it.
  google.protobuf.Timestamp payload_expires_at = 10;
}

message GetMessageRequest {
  int64 message_id = 1;
}

message GetMessageResponse {
  Message message = 1;
  repeated Delivery deliveries = 2;
}

message GetMessagePayloadRequest {
  int64 message_id = 1;
}

message GetMessagePayloadResponse {
  Message message = 1;
  // payload is the submitted body byte for byte.
  bytes payload = 2;
  google.protobuf.Timestamp payload_expires_at = 3;
}

enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0;
  DELIVERY_STATE_QUEUED = 1;
  DELIVERY_STATE_IN_FLIGHT = 2;
  DELIVERY_STATE_RETRY_SCHEDULED = 3;
  DELIVERY_STATE_SUCCEEDED = 4;
  DELIVERY_STATE_FAILED = 5;
  DELIVERY_STATE_CANCELLED = 6;
}

message Delivery {
  int64 id = 1;
  int64 message_id = 2;
  int64 endpoint_id = 3;
  DeliveryState state = 4;
  int32 attempt_count = 5;
  // due_at is the next attempt time while the delivery is queued or retry scheduled.
  optional google.protobuf.Timestamp due_at = 6;
  // deadline_at ends the cycle whatever happened before it.
  google.protobuf.Timestamp deadline_at = 7;
  optional string failure_reason = 8;
  optional int64 replay_of_delivery_id = 9;
  google.protobuf.Timestamp created_at = 10;
  optional google.protobuf.Timestamp completed_at = 11;
  // endpoint_revision is the endpoint configuration the cycle was planned under.
  int32 endpoint_revision = 12;
}

message ListAttemptsRequest {
  int64 delivery_id = 1;
  // include_previews asks for response previews; the server still requires the application to have them enabled.
  bool include_previews = 2;
}

message ListAttemptsResponse {
  repeated Attempt attempts = 1;
}

message Attempt {
  int64 id = 1;
  int64 delivery_id = 2;
  int32 number = 3;
  google.protobuf.Timestamp started_at = 4;
  optional google.protobuf.Timestamp completed_at = 5;
  optional int32 status_code = 6;
  // error_class names the failure kind (timeout, connection, tls, blocked_destination, ...) when there is no status.
  optional string error_class = 7;
  int32 latency_ms = 8;
  int32 secret_version = 9;
  int32 endpoint_revision = 10;
  string request_url = 11;
  // response_preview is the bounded start of the response body, present only when previews are allowed.
  optional string response_preview = 12;
  // response_headers are the receiver's headers minus set-cookie, present only when previews are allowed.
  map<string, string> response_headers = 13;
}

message ReplayDeliveryRequest {
  int64 delivery_id = 1;
  // idempotency_key makes repeated replay requests return the same new cycle.
  string idempotency_key = 2;
}

message ReplayDeliveryResponse {
  Delivery delivery = 1;
}

message CancelDeliveryRequest {
  int64 delivery_id = 1;
}

message CancelDeliveryResponse {
  Delivery delivery = 1;
}

message ResumeEndpointRequest {
  int64 endpoint_id = 1;
}

message ResumeEndpointResponse {
  Endpoint endpoint = 1;
}

message ArchiveEndpointRequest {
  int64 endpoint_id = 1;
}

message ArchiveEndpointResponse {
  Endpoint endpoint = 1;
  // cancelled_deliveries counts the unsent cycles the archive cancelled.
  int64 cancelled_deliveries = 2;
}

message ArchiveApplicationRequest {
  int64 application_id = 1;
}

message ArchiveApplicationResponse {
  Application application = 1;
  // archived_endpoints counts the endpoints this call archived.
  int64 archived_endpoints = 2;
  // cancelled_deliveries counts the unsent cycles this call cancelled.
  int64 cancelled_deliveries = 3;
}

message EventTypeList {
  // values are the event types to receive; empty means every event type.
  repeated string values = 1;
}

message UpdateEndpointRequest {
  int64 endpoint_id = 1;
  optional string url = 2;
  optional string description = 3;
  optional EventTypeList event_types = 4;
  // expected_revision makes the change conditional: ALREADY_EXISTS when the endpoint moved on.
  optional int32 expected_revision = 5;
}

message UpdateEndpointResponse {
  Endpoint endpoint = 1;
}

message RotateEndpointSecretRequest {
  int64 endpoint_id = 1;
  // retire_in is how long the previous secrets keep signing; zero retires them at once.
  google.protobuf.Duration retire_in = 2;
}

message RotateEndpointSecretResponse {
  Endpoint endpoint = 1;
  string signing_secret = 2;
  int32 secret_version = 3;
  // retire_at is when the previous secrets stop signing.
  google.protobuf.Timestamp retire_at = 4;
}

message ListMessagesRequest {
  // application_id or environment_id (or both) narrow the list; at least one is required.
  int64 application_id = 1;
  int64 environment_id = 2;
  string event_type = 3;
  string sender_event_id = 4;
  optional google.protobuf.Timestamp accepted_after = 5;
  optional google.protobuf.Timestamp accepted_before = 6;
  // outcome keeps messages with at least one delivery in that state.
  string outcome = 7;
  int32 limit = 8;
  int32 offset = 9;
  string sort_by = 10;
  string sort_dir = 11;
}

message DeliveryCounts {
  int32 queued = 1;
  int32 in_flight = 2;
  int32 retry_scheduled = 3;
  int32 succeeded = 4;
  int32 failed = 5;
  int32 cancelled = 6;
}

message MessageSummary {
  Message message = 1;
  DeliveryCounts counts = 2;
  google.protobuf.Timestamp payload_expires_at = 3;
}

message ListMessagesResponse {
  repeated MessageSummary messages = 1;
  int32 total = 2;
}

message AuditEvent {
  int64 id = 1;
  string workspace_id = 2;
  string actor_id = 3;
  string action = 4;
  string resource_type = 5;
  optional int64 resource_id = 6;
  string request_id = 7;
  // details is a JSON object with safe context, never secrets or payload bytes.
  bytes details = 8;
  google.protobuf.Timestamp occurred_at = 9;
}

message ListAuditEventsRequest {
  string actor_id = 1;
  string resource_type = 2;
  int64 resource_id = 3;
  optional google.protobuf.Timestamp after = 4;
  optional google.protobuf.Timestamp before = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  int32 total = 2;
}
